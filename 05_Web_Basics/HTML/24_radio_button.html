<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Button</title>
</head>
<body>
    <form action="/server">
        <div>
             <input type="radio" name="fruits" id="apple" value="apple">
             <label for="apple">apple</label>
             <input type="radio" name="fruits" id="banana" value="banana">
             <label for="banana">banana</label>
             <input type="radio" name="fruits" id="orange" value="orange">
             <label for="orange">orange</label>
        </div>
        <br>
        <div>
             <input type="checkbox" name="subject" id="math" value="math">
             <label for="math">Math</label>
             <input type="checkbox" name="subject" id="science" value="science">
             <label for="science">Science</label>
             <input type="checkbox" name="subject" id="history" value="history">
             <label for="history">History</label>
        </div>
        <button>Submit</button>

       
    </form>
</body>
</html>
