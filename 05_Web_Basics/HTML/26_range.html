<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range</title>
</head>
<body>
    <form action="25_dropdown.html">
        <label for="vol">Volume (between 0 and 100):</label>
        <input type="range" 
                id="vol" 
                name="vol" 
                min="0" 
                max="100"
                value="70" 
                step="10">
        <button>Submit</button>
    </form>
</body>
</html>
