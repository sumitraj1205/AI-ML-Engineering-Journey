<!DOCTYPE html>
<html>

<head>
    <title>Semantic HTML</title>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>

        <section>
            <h2>About Us</h2>
            <p>This section contains information about our website.</p>
        </section>

        <article>
            <h2>Latest Article</h2>
            <p>This is an independent article or piece of content.</p>
        </article>

        <aside>
            <h3>Related Information</h3>
            <p>This contains additional information related to the main content.</p>
        </aside>

    </main>

    <footer>
        <p>Copyright © 2026 My Website</p>
    </footer>

</body>

</html>
