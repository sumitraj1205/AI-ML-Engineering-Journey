<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div element</title>
</head>
<body>
    <span>
        <a href="https://www.google.com" target="_blank">Google</a>
        <a href="https://www.github.com" target="_blank">Github</a>
    </span>
    <a href="https://www.youtube.com" target="_blank">youtube</a>
    <span style="color: blue; font-size: 18px;" This is a span element with inline styles applied. It has a blue color and a font size of 18 pixels.>
        <h1>Heading 1</h1>
        <p>This is a paragraph inside a span element.</p>
    </span>
</body>
</html>
